# ==============================================================================
# CI de Turnazo (backend NestJS + Prisma)
#
# Qué hace en cada push / pull request:
#   1. Job "test":   instala dependencias, corre los tests unitarios y e2e
#                    y compila la app. Si algo falla, el pipeline queda en rojo.
#   2. Job "k8s-manifests": valida los manifiestos de k8s/ y k8s/monitoring/ contra
#                    el esquema de Kubernetes, chequea las configs de Prometheus y
#                    Alertmanager y corre los tests de las reglas de alerta
#                    (en paralelo con "test").
#   3. Job "docker": sólo si "test" pasó, construye la imagen Docker de producción
#                    para asegurar que el Dockerfile sigue funcionando.
#
# Los tests e2e levantan su propio PostgreSQL en memoria (PGlite), así que no
# hace falta ninguna base de datos ni secretos en GitHub.
# ==============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña "Actions"

# Si subís dos commits seguidos a la misma rama, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio: el workflow sólo puede leer el repo.
permissions:
  contents: read

jobs:
  test:
    name: Tests y build (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (npm ci + prisma generate)
        run: npm ci --no-audit --no-fund

      - name: Tests unitarios
        run: npm test -- --ci

      - name: Tests e2e (PostgreSQL en memoria con PGlite)
        run: npm run test:e2e -- --ci

      - name: Compilar (nest build)
        run: npm run build

  k8s-manifests:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Los Secrets se generan desde archivos .env que no están en git:
      # en CI usamos las plantillas con valores falsos sólo para poder renderizar.
      - name: Renderizar con kustomize (kubectl ya viene en el runner)
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          cp k8s/monitoring/secrets.env.example k8s/monitoring/secrets.env
          kubectl kustomize k8s > rendered.yaml
          kubectl kustomize k8s/monitoring > rendered-monitoring.yaml
          echo "Recursos generados (app):"
          grep -E '^kind:' rendered.yaml | sort | uniq -c
          echo "Recursos generados (monitoreo):"
          grep -E '^kind:' rendered-monitoring.yaml | sort | uniq -c

      # kubeconform valida cada recurso contra el esquema oficial de Kubernetes
      # (campos mal escritos, tipos incorrectos, etc.) sin necesitar un cluster.
      - name: Validar contra el esquema de Kubernetes (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary rendered.yaml rendered-monitoring.yaml

      # promtool / amtool vienen dentro de las imágenes oficiales: usamos las MISMAS
      # versiones que despliega k8s/monitoring/, así lo que valida CI es lo que corre.
      - name: Validar config y reglas de Prometheus (promtool)
        run: |
          docker run --rm -v "$PWD/k8s/monitoring/config:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Testear las alertas (promtool test rules)
        run: |
          docker run --rm -v "$PWD/k8s/monitoring/config:/etc/prometheus:ro" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            test rules alerts.test.yml

      - name: Validar config de Alertmanager (amtool)
        run: |
          mkdir -p /tmp/am-secrets && echo "token-falso" > /tmp/am-secrets/TELEGRAM_BOT_TOKEN
          docker run --rm \
            -v "$PWD/k8s/monitoring/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v /tmp/am-secrets:/etc/alertmanager/secrets:ro \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: test # no se ejecuta si fallaron los tests
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin publicarla)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: turnazo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
